# CI for the Astro site in site/ and catalog validation.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate highlights catalog
        run: python3 scripts/validate_highlights_catalog.py

      - name: Install and run site checks
        working-directory: site
        run: |
          npm ci
          npm run ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies and Playwright browsers
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: site
        run: npm run test:e2e
        env:
          CI: true
